name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run tests and build APK + release AAB
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: truth-test-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Validate signing secrets
        if: github.event_name != 'pull_request'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64" || (echo "UPLOAD_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$UPLOAD_STORE_PASSWORD" || (echo "UPLOAD_STORE_PASSWORD is missing" && exit 1)
          test -n "$UPLOAD_KEY_ALIAS" || (echo "UPLOAD_KEY_ALIAS is missing" && exit 1)
          test -n "$UPLOAD_KEY_PASSWORD" || (echo "UPLOAD_KEY_PASSWORD is missing" && exit 1)

      - name: Restore upload keystore
        if: github.event_name != 'pull_request'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/truth-test-upload.jks"
          test -s "$RUNNER_TEMP/truth-test-upload.jks"
          chmod 600 "$RUNNER_TEMP/truth-test-upload.jks"

      - name: Sign Google Play AAB
        if: github.event_name != 'pull_request'
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          jarsigner \
            -keystore "$RUNNER_TEMP/truth-test-upload.jks" \
            -storepass "$UPLOAD_STORE_PASSWORD" \
            -keypass "$UPLOAD_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -signedjar app/build/outputs/bundle/release/Truth-Test-1.0.0-google-play-signed.aab \
            app/build/outputs/bundle/release/app-release.aab \
            "$UPLOAD_KEY_ALIAS"

      - name: Verify signed AAB
        if: github.event_name != 'pull_request'
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/Truth-Test-1.0.0-google-play-signed.aab | tee "$RUNNER_TEMP/jarsigner-verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/jarsigner-verify.txt"
          sha256sum app/build/outputs/bundle/release/Truth-Test-1.0.0-google-play-signed.aab

      - name: Upload signed Google Play AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: truth-test-google-play-signed-aab
          path: app/build/outputs/bundle/release/Truth-Test-1.0.0-google-play-signed.aab
          if-no-files-found: error

      - name: Remove restored keystore
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/truth-test-upload.jks"
