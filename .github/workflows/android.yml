name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and build APK + release AAB
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: truth-test-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: truth-test-release-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
