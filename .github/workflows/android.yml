name: Android CI

on:
  push:
    branches: [ main, truth-test-phase1, truth-test-phase2, truth-test-phase3, truth-test-phase4, truth-test-phase5, truth-test-phase6, truth-test-final-hotfix, truth-test-admob-ui-fix, truth-test-custom-nav-admob-fix, truth-test-admob-v204 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        run: |
          ANDROID_SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Release contract audit
        run: |
          grep -Fq 'applicationId = "com.halahasneen.truthtest"' app/build.gradle.kts
          grep -Fq 'versionCode = 6' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.4"' app/build.gradle.kts
          grep -Fq 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          test ! -e app/src/main/java/com/halashasneen/truthtest/monetization/BillingManager.kt
          ! grep -R -nE 'BillingClient|billing-ktx|REMOVE_ADS_PRODUCT_ID|remove_ads|premiumCached|KEY_PREMIUM_CACHED' app/src app/build.gradle.kts
          grep -Fq 'ca-app-pub-3940256099942544/9214589741' app/build.gradle.kts
          grep -Fq 'ca-app-pub-3940256099942544/1033173712' app/build.gradle.kts
          grep -Fq 'ca-app-pub-3940256099942544/5224354917' app/build.gradle.kts
          grep -Fq 'ca-app-pub-3940256099942544/9257395921' app/build.gradle.kts
          grep -Fq 'ca-app-pub-5961173995415325~9450642239' app/build.gradle.kts
          grep -Fq 'ca-app-pub-5961173995415325/5080066660' app/build.gradle.kts
          grep -Fq 'ca-app-pub-5961173995415325/6736848981' app/build.gradle.kts
          grep -Fq 'ca-app-pub-5961173995415325/3452299387' app/build.gradle.kts
          grep -Fq 'ca-app-pub-5961173995415325/9826136046' app/build.gradle.kts

      - name: Phase quality gate
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Release candidate checksums
        if: github.ref == 'refs/heads/truth-test-phase6'
        run: |
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 sha256sum > release-candidate-sha256.txt
          cat release-candidate-sha256.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: truth-test-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release candidate builds
        if: github.ref == 'refs/heads/truth-test-phase6'
        uses: actions/upload-artifact@v4
        with:
          name: truth-test-release-candidate-builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/app-release.aab
            release-candidate-sha256.txt
          if-no-files-found: error

      - name: Validate signing secrets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/truth-test-final-hotfix' || (github.ref == 'refs/heads/truth-test-admob-ui-fix' || (github.ref == 'refs/heads/truth-test-custom-nav-admob-fix' || github.ref == 'refs/heads/truth-test-admob-v204'))))
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64" || (echo "UPLOAD_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$UPLOAD_STORE_PASSWORD" || (echo "UPLOAD_STORE_PASSWORD is missing" && exit 1)
          test -n "$UPLOAD_KEY_ALIAS" || (echo "UPLOAD_KEY_ALIAS is missing" && exit 1)
          test -n "$UPLOAD_KEY_PASSWORD" || (echo "UPLOAD_KEY_PASSWORD is missing" && exit 1)

      - name: Restore upload keystore
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/truth-test-final-hotfix' || (github.ref == 'refs/heads/truth-test-admob-ui-fix' || (github.ref == 'refs/heads/truth-test-custom-nav-admob-fix' || github.ref == 'refs/heads/truth-test-admob-v204'))))
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/truth-test-upload.jks"
          test -s "$RUNNER_TEMP/truth-test-upload.jks"
          chmod 600 "$RUNNER_TEMP/truth-test-upload.jks"

      - name: Sign Google Play AAB
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/truth-test-final-hotfix' || (github.ref == 'refs/heads/truth-test-admob-ui-fix' || (github.ref == 'refs/heads/truth-test-custom-nav-admob-fix' || github.ref == 'refs/heads/truth-test-admob-v204'))))
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: >
          jarsigner
          -keystore "$RUNNER_TEMP/truth-test-upload.jks"
          -storepass "$UPLOAD_STORE_PASSWORD"
          -keypass "$UPLOAD_KEY_PASSWORD"
          -sigalg SHA256withRSA
          -digestalg SHA-256
          -signedjar app/build/outputs/bundle/release/Truth-Test-2.0.4-google-play-signed.aab
          app/build/outputs/bundle/release/app-release.aab
          "$UPLOAD_KEY_ALIAS"

      - name: Verify signed AAB
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/truth-test-final-hotfix' || (github.ref == 'refs/heads/truth-test-admob-ui-fix' || (github.ref == 'refs/heads/truth-test-custom-nav-admob-fix' || github.ref == 'refs/heads/truth-test-admob-v204'))))
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/Truth-Test-2.0.4-google-play-signed.aab | tee "$RUNNER_TEMP/jarsigner-verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/jarsigner-verify.txt"
          sha256sum app/build/outputs/bundle/release/Truth-Test-2.0.4-google-play-signed.aab

      - name: Sign release APK with existing upload key
        if: github.event_name == 'push' && (github.ref == 'refs/heads/truth-test-final-hotfix' || (github.ref == 'refs/heads/truth-test-admob-ui-fix' || (github.ref == 'refs/heads/truth-test-custom-nav-admob-fix' || github.ref == 'refs/heads/truth-test-admob-v204')))
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/truth-test-aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/truth-test-upload.jks" \
            --ks-key-alias "$UPLOAD_KEY_ALIAS" \
            --ks-pass env:UPLOAD_STORE_PASSWORD \
            --key-pass env:UPLOAD_KEY_PASSWORD \
            --out app/build/outputs/apk/release/Truth-Test-2.0.4-signed.apk \
            "$RUNNER_TEMP/truth-test-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/Truth-Test-2.0.4-signed.apk

      - name: Upload signed release APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/truth-test-final-hotfix' || (github.ref == 'refs/heads/truth-test-admob-ui-fix' || (github.ref == 'refs/heads/truth-test-custom-nav-admob-fix' || github.ref == 'refs/heads/truth-test-admob-v204')))
        uses: actions/upload-artifact@v4
        with:
          name: truth-test-v204-signed-apk
          path: app/build/outputs/apk/release/Truth-Test-2.0.4-signed.apk
          if-no-files-found: error

      - name: Upload signed Google Play AAB
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/truth-test-final-hotfix' || (github.ref == 'refs/heads/truth-test-admob-ui-fix' || (github.ref == 'refs/heads/truth-test-custom-nav-admob-fix' || github.ref == 'refs/heads/truth-test-admob-v204'))))
        uses: actions/upload-artifact@v4
        with:
          name: truth-test-v204-signed-aab
          path: app/build/outputs/bundle/release/Truth-Test-2.0.4-google-play-signed.aab
          if-no-files-found: error

      - name: Signed artifact checksums
        if: github.event_name == 'push' && (github.ref == 'refs/heads/truth-test-final-hotfix' || (github.ref == 'refs/heads/truth-test-admob-ui-fix' || (github.ref == 'refs/heads/truth-test-custom-nav-admob-fix' || github.ref == 'refs/heads/truth-test-admob-v204')))
        run: |
          sha256sum app/build/outputs/apk/release/Truth-Test-2.0.4-signed.apk
          sha256sum app/build/outputs/bundle/release/Truth-Test-2.0.4-google-play-signed.aab

      - name: Remove restored keystore
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/truth-test-final-hotfix' || (github.ref == 'refs/heads/truth-test-admob-ui-fix' || (github.ref == 'refs/heads/truth-test-custom-nav-admob-fix' || github.ref == 'refs/heads/truth-test-admob-v204'))))
        run: rm -f "$RUNNER_TEMP/truth-test-upload.jks"

  emulator_smoke:
    name: Debug emulator navigation and Google test ad smoke
    if: (github.ref == 'refs/heads/truth-test-custom-nav-admob-fix' || github.ref == 'refs/heads/truth-test-admob-v204')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for Android emulator
        run: sudo chmod 666 /dev/kvm
      - name: Run instrumented navigation and Google test-ad smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon
            adb shell settings put system font_scale 1.4
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.halashasneen.truthtest.ui.CustomNavigationDeviceTest --no-daemon
      - name: Upload device-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truth-test-v204-emulator-report
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
