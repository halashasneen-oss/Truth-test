name: One-time PNG launcher icon fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-png-launcher-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace launcher with canonical PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/mipmap-nodpi
          cat > "$RUNNER_TEMP/icon.b64" <<'B64'
          [... ELLIPSIZATION ...]
          B64
          tr -d '[:space:]' < "$RUNNER_TEMP/icon.b64" | base64 --decode > app/src/main/res/mipmap-nodpi/ic_launcher.png
          cp app/src/main/res/mipmap-nodpi/ic_launcher.png app/src/main/res/mipmap-nodpi/ic_launcher_round.png
          file app/src/main/res/mipmap-nodpi/ic_launcher.png | grep -q 'PNG image data'

          rm -f app/src/main/res/mipmap-nodpi/ic_launcher.webp
          rm -f app/src/main/res/mipmap-nodpi/ic_launcher_round.webp
          rm -f app/src/main/res/drawable-nodpi/ic_launcher_art.webp
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('android:icon="@drawable/ic_launcher_art"', 'android:icon="@mipmap/ic_launcher"')
          s = s.replace('android:roundIcon="@drawable/ic_launcher_art"', 'android:roundIcon="@mipmap/ic_launcher_round"')
          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml

      - name: Commit PNG launcher fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/AndroidManifest.xml app/src/main/res
          git commit -m 'fix: package launcher icon as canonical PNG'
          git push origin HEAD:main
