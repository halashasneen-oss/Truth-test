name: One-time PNG launcher icon fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-png-launcher-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert launcher artwork to canonical PNG resources
        shell: bash
        run: |
          set -euo pipefail

          SRC='app/src/main/res/drawable-nodpi/ic_launcher_art.webp'
          TMP="$RUNNER_TEMP/truth-test-launcher.png"

          ffmpeg -hide_banner -loglevel error -y -i "$SRC" "$TMP"
          file "$TMP" | grep -q 'PNG image data'

          declare -A sizes=(
            [mipmap-mdpi]=48
            [mipmap-hdpi]=72
            [mipmap-xhdpi]=96
            [mipmap-xxhdpi]=144
            [mipmap-xxxhdpi]=192
          )

          for folder in "${!sizes[@]}"; do
            size="${sizes[$folder]}"
            mkdir -p "app/src/main/res/$folder"
            ffmpeg -hide_banner -loglevel error -y -i "$TMP" -vf "scale=${size}:${size}:flags=lanczos" "app/src/main/res/$folder/ic_launcher.png"
            cp "app/src/main/res/$folder/ic_launcher.png" "app/src/main/res/$folder/ic_launcher_round.png"
          done

          mkdir -p app/src/main/res/mipmap-nodpi
          ffmpeg -hide_banner -loglevel error -y -i "$TMP" -vf 'scale=256:256:flags=lanczos' app/src/main/res/mipmap-nodpi/ic_launcher.png
          cp app/src/main/res/mipmap-nodpi/ic_launcher.png app/src/main/res/mipmap-nodpi/ic_launcher_round.png

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('android:icon="@drawable/ic_launcher_art"', 'android:icon="@mipmap/ic_launcher"')
          text = text.replace('android:roundIcon="@drawable/ic_launcher_art"', 'android:roundIcon="@mipmap/ic_launcher_round"')
          manifest.write_text(text, encoding='utf-8')
          PY

          rm -f app/src/main/res/mipmap-nodpi/ic_launcher.webp
          rm -f app/src/main/res/mipmap-nodpi/ic_launcher_round.webp
          rm -f app/src/main/res/drawable-nodpi/ic_launcher_art.webp
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          file app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | grep -q 'PNG image data'
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml

      - name: Commit PNG launcher fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/AndroidManifest.xml app/src/main/res
          if git diff --cached --quiet; then
            echo 'No launcher changes to commit.'
            exit 0
          fi
          git commit -m 'fix: package launcher icon as standard PNG mipmaps'
          git push origin HEAD:main
