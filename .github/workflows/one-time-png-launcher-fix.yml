name: One-time PNG launcher icon fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-png-launcher-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert launcher artwork to canonical PNG resources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('app/src/main/res/drawable-nodpi/ic_launcher_art.webp')
          image = Image.open(src).convert('RGBA')
          image.load()

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              out_dir = Path('app/src/main/res') / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              icon = image.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(out_dir / 'ic_launcher.png', format='PNG', optimize=True)
              icon.save(out_dir / 'ic_launcher_round.png', format='PNG', optimize=True)

          # Keep a high-resolution PNG master for tooling/inspection as well.
          master_dir = Path('app/src/main/res/mipmap-nodpi')
          master_dir.mkdir(parents=True, exist_ok=True)
          master = image.resize((256, 256), Image.Resampling.LANCZOS)
          master.save(master_dir / 'ic_launcher.png', format='PNG', optimize=True)
          master.save(master_dir / 'ic_launcher_round.png', format='PNG', optimize=True)

          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('android:icon="@drawable/ic_launcher_art"', 'android:icon="@mipmap/ic_launcher"')
          text = text.replace('android:roundIcon="@drawable/ic_launcher_art"', 'android:roundIcon="@mipmap/ic_launcher_round"')
          manifest.write_text(text, encoding='utf-8')
          PY

          # Remove formats/layers that caused inconsistent previews on some devices.
          rm -f app/src/main/res/mipmap-nodpi/ic_launcher.webp
          rm -f app/src/main/res/mipmap-nodpi/ic_launcher_round.webp
          rm -f app/src/main/res/drawable-nodpi/ic_launcher_art.webp
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          file app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | grep -q 'PNG image data'
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml

      - name: Commit PNG launcher fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/AndroidManifest.xml app/src/main/res
          if git diff --cached --quiet; then
            echo 'No launcher changes to commit.'
            exit 0
          fi
          git commit -m 'fix: package launcher icon as standard PNG mipmaps'
          git push origin HEAD:main
